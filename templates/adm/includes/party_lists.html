{% load static %}  

<!-- Add PartyList -->
<div class="modal fade" id="add_party">
    <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header border-bottom border-width-4 border-color-secondary align-items-center pb-2">
            <h3 class="modal-title text-bold"> Create New Party </h3>
            <button class="close" type="button" data-dismiss="modal" aria-label="Close">
                <span aria-hidden="true">x</span>
            </button>
          </div>
            <div class="modal-body">
              <form class="forme form-horizontal" method="post" action="{% url 'add_party' %}">
                {% csrf_token %}
                {% for field in party_form  %}
                <div class="form-group has-feedback mb-4">
                    <span class="text-danger">
                        {{field.errors}}
                    </span>
                    
                        {{field}}
                </div>
                {% endfor %}
                <div class="modal-footer justify-content-center">
                  <button type="button" class="btn-lg btn-simple" data-dismiss="modal">Cancel</button>
                  <button type="submit" class="btn-lg btn-success" name="add">Submit</button>
                </div>
              </form>
            </div>
        </div>
      </div>
    </div>
  
<!-- Update Party -->
<div class="modal fade" id="edit_party">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header border-bottom border-width-4 border-color-secondary align-items-center pb-2">
                <h3 class="modal-title"> Update Party </h3>
                <button class="close" type="button" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">x</span>
                </button>
            </div>
            <div class="modal-body">
                <form class="forme form-horizontal" enctype="multipart/form-data" method="post" action="{% url 'update_party' %}">
                    {% csrf_token %}
                    <input type="hidden" class="party_id" name="party_id" id="party_id">
                    <div class="form-group has-feedback mb-4">
                      <span class="text-danger"></span>
                      <label for="">Name:</label>
                      <input type="text" name="name" maxlength="100" class="form-control" id="party_list_name">
                    </div>
                    <div class="modal-footer justify-content-center">
                        <button type="button" class="btn-lg btn-simple" data-dismiss="modal">Cancel</button>
                        <button class="btn-lg btn-success" type="submit">
                          Submit
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
  
  
  <!-- Delete -->
  <div class="modal fade" id="delete_party">
    <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header align-items-center pb-2">
            <h3 class="modal-title" ></h3>
            <button class="close" type="button" data-dismiss="modal" aria-label="Close">
                <span aria-hidden="true">x</span>
            </button>
          </div>
            <div class="modal-body">
              <form class="forme form-horizontal" method="post" action="{% url 'delete_party' %}">
                {% csrf_token %}
                <input type="hidden" class="party_id" name="party_id" id="party_id">
                <div class="text-center">
                    <p>Delete Party?</p>
                    <h2 class="bold party_name"></h2>
                </div>
                <div class="modal-footer justify-content-center border-top-none">
                  <button type="button" class="btn-lg btn-simple" data-dismiss="modal">Cancel</button>
                  
                  <button type="submit" class="btn-lg btn-danger" name="add">Confirm</button>
                </div>
              </form>
            </div>
        </div>
    </div>
  </div>

  <div class="modal fade" id="delete_parties">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" data-dismiss="modal" aria-label="Close" class="close">
                    <span aria-hidden="true">x</span>
                </button>
            </div> 
           <div class="modal-body">
            <form action="{% url 'delete_all_parties' %}" class="forme form-horizontal" method="post">
                {% csrf_token %}
                <div class="text-center">
                    <h4 class="text-bold">All Party Lists will be deleted.</h4>
                    <p>Please click "Confirm" to delete.</p>
                </div>
                <div class="modal-footer justify-content-center border-top-none">
                    <button type="button" class="btn-lg btn-simple" data-dismiss="modal">Cancel</button>
                    <button class="btn-lg btn-danger" type="submit">Confirm</button>
                    
                </div>
            </form>
           </div>
        </div>
    </div>
  </div>
