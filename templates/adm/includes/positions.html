{% load static %}
<!--Add-->
<div class="modal fade" id="add_position">
    <div class="modal-dialog ">
      <div class="modal-content">
        <div class="modal-header border-bottom border-width-4 border-color-secondary align-items-center pb-2">
          <h3 class="modal-title">Add New Position</h3>
          <button class="close" type="button" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">x</span>
          </button>
        </div>
        <div class="modal-body">
          <form class="forme form-horizontal" method="post" action="{% url 'add_position' %}">
          {% csrf_token %}
            <div class="container mb-4">
              {% for field in position_form %}
              <div class="form-group has-feedback">
                <span class="text-danger">{{ field.errors }}</span>
                {{ field }}
              </div>
              {% endfor %}
            </div>
            <div class="modal-footer justify-content-center">
                <button type="button" class="btn-lg btn-simple" data-dismiss="modal">Cancel</button>
                <button class="btn-lg btn-success" type="submit">Submit</button>
            </div>
          </form>
        </div>
      </div>
  </div>
</div>
  
  <!-- Edit -->
  <div class="modal fade" id="edit_position">
    <div class="modal-dialog ">
        <div class="modal-content">
            <div class="modal-header border-bottom border-width-4 border-color-secondary align-items-center pb-2">
              <h3 class="modal-title">Update Position</h3>
                <button class="close" type="button" data-dismiss="modal" aria-label="Close">
                  <span aria-hidden="true">x</span>
                </button>
            </div>
            <div class="modal-body">
              <form class="forme form-horizontal" method="POST" action="{% url 'update_position' %}">
                {% csrf_token %}
                <input type="hidden" class="position_id" name="position_id" id="position_id">

                <div class="container mb-4 p-0">
                  <div class="form-group has-feedback">
                    <label for="edit_name" class=" control-label">Name</label>
                    <input type="text" class="form-control" id="edit_position_name" name="name">
                  </div>
                  
                  <div class="form-group">
                    <label for="edit_max_vote" class=" control-label">Max Votes</label> 
                    <input type="number" class="form-control" id="edit_max_vote" name="max_vote">
                  </div>

                  <div class="form-group" id="college-input">
                    <label for="" class=" control-label">College</label>
                   
                      <select name="college" id="edit_college" class="form-control">
                        <option value="">------</option>
                      </select>
             
                  </div>
                </div>
                  <div class="modal-footer justify-content-center">
                    <button type="button" class="btn-lg btn-simple" data-dismiss="modal">Cancel</button>
                    <button class="btn-lg btn-success" type="submit">Submit</button>
                  </div>
              </form>
            </div>
        </div>
    </div>
  </div>
  
  <!-- Delete -->
  <div class="modal fade" id="delete_position">
    <div class="modal-dialog ">
      <div class="modal-content">
        <div class="modal-header align-items-center pb-2">
          <h3 class="modal-title"></h3>
          <button class="close" type="button" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">x</span>
          </button>
        </div>
            <div class="modal-body">
              <form class="forme form-horizontal" method="POST" action="{% url 'delete_position' %}">
                {% csrf_token %}
                <input type="hidden" class="position_id" name="position_id" id="position_id">
                <div class="text-center mb-4">
                    <p>DELETE POSITION</p>
                    <h2 class="bold position_name"></h2>
                </div>
                <div class="modal-footer justify-content-center border-top-none">
                  <button type="button" class="btn-lg btn-simple" data-dismiss="modal">Cancel</button>
                  <button type="submit" class="btn-lg btn-danger" name="delete">Confirm</button>
                </div>
              </form>
            </div>
        </div>
    </div>
  </div>
  
  <!-- Delete All -->
  <div class="modal fade" id="delete_positions">
    <div class="modal-dialog ">
      <div class="modal-content">
        <div class="modal-header align-items-center pb-2">
          <h3 class="modal-title"></h3>
          <button class="close" type="button" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">x</span>
          </button>
        </div>
        <div class="modal-body">
          <div class="text-center">
              <h4>All Positions will be deleted.</h4>
              <h5>Click "Confirm" to delete.</h5>
          </div>
          <div class="modal-footer justify-content-center border-top-none">
            <button type="button" class="btn-lg btn-simple" data-dismiss="modal">Cancel</button>
            <button class="btn-lg btn-danger" onclick="window.location.href='{% url 'delete_all_positions' %}'">Confirm</button>
          </div>
        </div>
      </div>
    </div>
  </div>
